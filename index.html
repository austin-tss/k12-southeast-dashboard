<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><script>try{if(localStorage.getItem("k12theme")!=="light")document.documentElement.dataset.theme="dark"}catch(e){}</script><title>K12 South East Sales Dashboard | Howard Technology Solutions</title>
<style>
:root{--navy:#002b64;--red:#0098d1;--accent:#0098d1;--bg:#f4f6f9;--card:#fff;--mut:#6b7280;--g:#15803d;--y:#b45309;--r:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#111}
header{background:var(--navy);border-bottom:4px solid var(--accent);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.5px}.logo{display:flex;align-items:center;gap:8px}.logo .ts{color:#9fdcf5;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-left:1px solid #ffffff55;padding-left:8px}
header h1{font-size:16px;margin:0;font-weight:600;flex:1}header a{color:#cfe0ff;font-size:13px}
.tick{background:#fff;border-bottom:1px solid #dde3ea;overflow:hidden;white-space:nowrap}.track{display:inline-flex;gap:10px;padding:10px;animation:sc 60s linear infinite}.track{animation-play-state:running!important;will-change:transform}
@keyframes sc{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.t{min-width:210px;border:1px solid #dde3ea;border-radius:10px;padding:8px 10px;cursor:pointer;background:#fafbfd}.t.ytd{background:#eef4ff;border-color:#9db8e6}
.t b{display:block;font-size:14px}.t .l{font-size:11px;color:var(--mut)}.t .v{font-size:13px}
main{padding:14px;max-width:1100px;margin:auto;display:grid;gap:14px}
.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 3px #0001}.card h2{margin:0 0 10px;font-size:16px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tg button,.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);padding:5px 10px;border-radius:6px;font-size:13px;cursor:pointer}.tg button.on{background:var(--navy);color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #eef1f5;cursor:pointer}.row:last-child{border:0}.rk{width:24px;font-weight:700;color:var(--navy)}.nm{flex:1}.bar{height:6px;background:#e5e7eb;border-radius:3px;margin-top:4px}.bar i{display:block;height:6px;border-radius:3px;background:var(--navy)}
.big{font-size:32px;font-weight:700;color:var(--navy)}.mut{color:var(--mut);font-size:12px}.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.st{background:#f7f9fc;border-radius:8px;padding:8px}.st .l{font-size:11px;color:var(--mut)}.st .v{font-weight:600}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-width:700px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
.mail{display:inline-block;background:var(--red);color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;font-weight:600}
select{padding:5px;border-radius:6px;border:1px solid #ccc}
.pin{max-width:320px;margin:40px auto;text-align:center}.dots{display:flex;justify-content:center;gap:14px;margin:20px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy)}.dots i.f{background:var(--navy)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pad button{height:68px;border-radius:50%;border:1px solid #d1d9e6;background:#fff;font-size:26px;color:var(--navy);cursor:pointer}.pad button:active{background:#e6eefa}.pad .x{border:0;background:none;font-size:16px}
.err{color:var(--r);min-height:20px;font-size:14px}
.lb{grid-column:1/-1;width:100%;border:2px solid var(--navy);background:linear-gradient(#eef4ff,#fff 120px)}.lb h2{font-size:20px}.lb .tg button{padding:8px 14px;font-size:14px;font-weight:600}.lb .bar{height:10px}.lb .bar i{height:10px}
.lb .p0{background:#fff8e1;border-left:4px solid #d4a017}.lb .p0 .bar i{background:#d4a017}.lb .p1{background:#f4f5f7;border-left:4px solid #9ca3af}.lb .p1 .bar i{background:#9ca3af}.lb .p2{background:#fbf0e6;border-left:4px solid #b06a2c}.lb .p2 .bar i{background:#b06a2c}.lb .rk{font-size:18px;width:30px}

html[data-theme=dark] .sheet{background:#1e293b;color:#e5e7eb}

html[data-theme=dark] .lb .p0{background:#3b3214;border-left-color:#facc15}html[data-theme=dark] .lb .p0 .bar i{background:#facc15}
html[data-theme=dark] .lb .p1{background:#2b3442;border-left-color:#cbd5e1}html[data-theme=dark] .lb .p1 .bar i{background:#cbd5e1}
html[data-theme=dark] .lb .p2{background:#3a2616;border-left-color:#f59e0b}html[data-theme=dark] .lb .p2 .bar i{background:#d97706}
html[data-theme=dark] .bar i{background:#60a5fa}
html[data-theme=dark] #tipBox,html[data-theme=dark] #welcome{background:#1e293b!important;color:#e5e7eb;border-color:#60a5fa!important}
html[data-theme=dark] [style*="background:#fff8e1"]{background:#3b3214!important;color:#fde68a}
html[data-theme=dark] [style*="background:#eef4ff"]{background:#1e3a5f!important;color:#e5e7eb!important;border-color:#3b82f6!important}
html[data-theme=dark] [style*="background:#f0f7f1"]{background:#14301f!important;color:#bbf7d0!important;border-color:#166534!important}
html[data-theme=dark] a{color:#93c5fd}html[data-theme=dark] .mail{color:#fff;background:#0098d1}
html[data-theme=dark] .modal{background:#000a}
#thBtn{background:transparent;border:1px solid #cfe0ff;color:#fff;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}
.tt h2{font-size:20px}

.card h2{font-weight:700}.btn,.tg button{border-radius:4px;font-family:inherit}.tg button.on{background:var(--navy);border-color:var(--navy)}

.pin h2{color:var(--navy)}.pad button{border-color:#b9d9ee}.pad button:active{background:#e3f4fb}.dots i.f{background:var(--accent)}.dots i{border-color:var(--accent)}
main.sub>.dinfo,main.sub>.tg,main.sub .tt,main.sub .topc{display:none}
footer{text-align:center;color:var(--mut);font-size:12px;padding:18px 10px 26px}

html[data-theme=dark] .lb{border-top-color:#38bdf8!important}html[data-theme=dark] .tg button.on{background:#0098d1;border-color:#0098d1}

<script>
const API=/github\.io$/.test(location.hostname)?'https://k12-southeast-dashboard.tss-receivables.workers.dev':'';
const tokGet=()=>{try{return localStorage.getItem('k12tok')||''}catch(e){return ''}},tokSet=t=>{try{t?localStorage.setItem('k12tok',t):localStorage.removeItem('k12tok')}catch(e){}};
const _f=window.fetch.bind(window);window.fetch=(u,o={})=>{if(typeof u==='string'&&/^\/(api|oauth)\//.test(u)){const h=new Headers(o.headers||{});const t=tokGet();if(t)h.set('x-k12-session',t);return _f(API+u,{...o,headers:h,credentials:'include'})}return _f(u,o)};

function exReport(){const d=exData();$('#exOut').innerHTML=`<div class="grid">${[['Receipts',fm(d.rt)+` (${d.r.length})`],['Mileage',fm(d.mt)+` (${d.mi.toFixed(1)} mi)`],['Total',fm(d.rt+d.mt)]].map(([l,v])=>`<div class="st"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>
 ${d.r.map(x=>`<div class="row" style="cursor:default"><span class="nm">${esc(x.date)} · ${esc(x.merchant)}<div class="mut">${esc(x.meal_type)}${x.people&&x.people.length?' · '+esc(x.people.join(', ')):''}</div></span><b>${fm(x.total)}</b></div>`).join('')}
 ${d.m.map(x=>`<div class="row" style="cursor:default"><span class="nm">${esc(x.date)} · Mileage ${x.total_miles} mi @ $${x.rate}<div class="mut">${esc(x.stops.map(s=>s.label).join(' → '))}${x.purpose?' · '+esc(x.purpose):''}</div></span><b>${fm(x.amount)}</b> <a href="#" data-dt="${x.id}" title="Delete trip" style="text-decoration:none">🗑</a></div>`).join('')||''}`;
 document.querySelectorAll('[data-dt]').forEach(a=>a.onclick=async e=>{e.preventDefault();if(!confirm('Delete this trip?'))return;await api('/api/mileage/'+a.dataset.dt,{method:'DELETE'});TRIPS=TRIPS.filter(t=>t.id!==a.dataset.dt);exReport()})}
function exLines(){const d=exData();const L=[`K12 South East Expense Report: Nathan White`,`Howard Technology Solutions`,`Period: ${d.f||'start'} to ${d.t||'today'}`,'',`RECEIPTS (${d.r.length})`];
 d.r.forEach(x=>L.push(`${x.date}  ${x.merchant}  ${fm(x.total)}  (sub ${fm(x.subtotal)||'-'}, tax ${fm(x.tax)||'-'}, tip ${fm(x.tip)||'-'})  ${x.meal_type}${x.people&&x.people.length?' with '+x.people.join(', '):''}`));
 L.push(`Receipts total: ${fm(d.rt)}`,'',`MILEAGE (${d.m.length} trips, ${d.mi.toFixed(1)} mi)`);d.m.forEach(x=>L.push(`${x.date}  ${x.stops.map(s=>s.label).join(' -> ')}  ${x.total_miles} mi @ $${x.rate}/mi = ${fm(x.amount)}${x.purpose?'  ('+x.purpose+')':''}`));
 L.push(`Mileage total: ${fm(d.mt)}`,'',`GRAND TOTAL: ${fm(d.rt+d.mt)}`);return L}
function exText(){return exLines().join('\n')}
function makePdf(lines){const wrap=[];lines.forEach(l=>{l=String(l).replace(/[^\x20-\x7E]/g,'');while(l.length>95){wrap.push(l.slice(0,95));l='   '+l.slice(95)}wrap.push(l)});
 const per=52,pages=[];for(let i=0;i<wrap.length;i+=per)pages.push(wrap.slice(i,i+per));if(!pages.length)pages.push(['']);
 const objs=[];const add=s=>{objs.push(s);return objs.length};const cat=add(''),pagesId=add(''),font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');const kids=[];
 pages.forEach((pg,pi)=>{const esc2=s=>s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');let c='BT /F1 10 Tf 13 TL 50 750 Td ';pg.forEach((l,i)=>{c+=(i===0&&pi===0?'/F1 13 Tf ':i===1&&pi===0?'/F1 10 Tf ':'')+`(${esc2(l)}) Tj T* `});c+='ET';
  const cs=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 612 792] /Contents ${cs} 0 R /Resources << /Font << /F1 ${font} 0 R >> >> >>`))});
 objs[cat-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;objs[pagesId-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
 let out='%PDF-1.4\n';const off=[];objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});const x=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R >>\nstartxref\n${x}\n%%EOF`;return new Blob([out],{type:'application/pdf'})}
async function exportPdf(){const d=exData();const name=`K12 Expense Report ${d.f||''} to ${d.t||''}.pdf`;const b=makePdf(exLines());const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
 if(RS&&RS.drive){$('#exErr').innerHTML='<span class="mut">Downloaded. Uploading to Drive…</span>';const fd=new FormData();fd.append('pdf',b,name);fd.append('name',name);try{const r=await api('/api/expenses/pdf',{method:'POST',body:fd});$('#exErr').innerHTML=`<span class="g">Downloaded and saved to Drive. <a href="${r.link}" target="_blank">Open</a></span>`}catch(e){$('#exErr').textContent='Downloaded. Drive upload failed: '+e.message}}else if(RS&&RS.google)drivePrompt('#exErr',()=>{$('#exErr').innerHTML='<span class="mut">Downloaded.</span>'});else $('#exErr').innerHTML='<span class="mut">Downloaded. (Google Drive upload is not set up yet.)</span>'}
// Welcome + tips
const TIPS=[['ticker','.tick','Rep ticker: tap a card to flip between MTD and YTD. Tap a name for details.'],['leaderboard','.lb','Leaderboard: switch between YTD and MTD ordered.'],['holds','#holdsCard','Orders on hold: tap a rep to see held orders, or tap ✉️ to email them.'],['monday','[data-tab=mon]','Monday Morning Report: each rep\'s weekly report.'],['tuesday','[data-tab=tue]','Tuesday Report: Jane Frye\'s weekly report, including holds.'],['receipts','[data-tab=rcp]','Receipts: snap a receipt with the in-page camera and it fills itself in.'],['expenses','[data-tab=exp]','Expenses: log mileage in plain words and export an expense report.']];
let TS=null,tipConfirm=false;
async function initTips(){try{TS=await api('/api/tips')}catch{return}drawHoldsNote();if(!TS.welcomed)return showWelcome();showTip()}
function showWelcome(){const d=document.createElement('div');d.id='welcome';d.className='card';d.style.cssText='position:fixed;left:50%;top:70px;transform:translateX(-50%);width:min(92vw,460px);z-index:20;border:2px solid var(--navy);box-shadow:0 8px 30px #0003';
 d.innerHTML=`<h2 style="margin-top:0">Welcome, Nathan 👋</h2><div style="font-size:14px;line-height:1.6">
 • <b>Rep ticker</b>: tap a card to flip MTD/YTD<br>• <b>Leaderboard</b>: reps ranked by YTD or MTD ordered<br>• <b>Rep details</b>: tap any rep for all their numbers and quoting<br>• <b>Orders on hold</b>: held orders by rep<br>• <b>Receipt scanner</b>: snap a receipt and Gemini reads it<br>• <b>Mileage</b>: describe your trip, get miles and reimbursement<br>• <b>Monday Morning Report</b>: weekly rep reports<br>• <b>Tuesday Report</b>: Jane Frye's weekly report<br>• <b>Email a rep</b>: tap ✉️ to email them from your phone<div class="mut" style="margin-top:8px;line-height:1.5">Your dashboard updates every weekday by 9 AM Central.<br>Orders on hold come from Jane Frye's Tuesday report, so that one updates whenever Jane sends it.</div></div>
 <button class="mail" id="wGo" style="border:0;margin-top:12px;cursor:pointer;width:100%">Let's go</button>`;document.body.appendChild(d);
 $('#wGo').onclick=async()=>{d.remove();await api('/api/tips',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({welcomed:true})}).catch(()=>{});TS=await api('/api/tips').catch(()=>null);showTip()}}
function drawHoldsNote(){const el=$('#holdsNote');if(!el||!TS||(TS.notes_hidden||[]).includes('holds_intro'))return el&&(el.innerHTML='');let step=0;
 el.innerHTML=`<div style="background:#eef4ff;border:1px solid #9db8e6;border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px;color:#111">ℹ️ These are orders on hold from <b>Jane Frye's Tuesday report</b>. Tap a rep to see their held orders, or tap their name to email them.<div style="margin-top:6px"><a href="#" id="hnHide" class="mut">Prefer not to see this</a></div></div>`;
 $('#hnHide').onclick=e=>{e.preventDefault();step++;const a=e.target;a.style.color='var(--r)';
  if(step===1)a.textContent='This note will go away forever. Tap again to confirm.';
  else if(step===2)a.textContent='Are you sure? Tap once more to hide it forever.';
  else{TS.notes_hidden=[...(TS.notes_hidden||[]),'holds_intro'];el.innerHTML='';api('/api/tips',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({hide_note:'holds_intro'})}).catch(()=>{})}}}
function showTip(){drawHoldsNote();const old=$('#tipBox');if(old)old.remove();if(!TS||!TS.active)return;const seen=new Set([...(TS.dismissed||[]),...(TS.hidden||[])]);
 const t=TIPS.find(([id,sel])=>!seen.has(id)&&document.querySelector(sel)&&document.querySelector(sel).offsetParent!==null);if(!t)return;const el=document.querySelector(t[1]);const r=el.getBoundingClientRect();
 const b=document.createElement('div');b.id='tipBox';b.style.cssText=`position:absolute;z-index:15;left:${Math.max(8,Math.min(r.left+scrollX,innerWidth-290))}px;top:${r.bottom+scrollY+6}px;width:280px;background:#fff;border:1px solid var(--navy);border-radius:10px;padding:10px;box-shadow:0 4px 14px #0002;font-size:13px`;
 tipConfirm=false;b.innerHTML=`<div>💡 ${esc(t[2])}</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center"><button class="btn" id="tGot">Got it</button><a href="#" id="tHide" class="mut">Prefer not to see this</a><a href="#" id="tOff" class="mut">Turn off tips</a></div>`;document.body.appendChild(b);
 const post=o=>api('/api/tips',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(o)}).catch(()=>{});
 $('#tGot').onclick=()=>{TS.dismissed=[...(TS.dismissed||[]),t[0]];post({dismiss:t[0]});showTip()};
 $('#tHide').onclick=e=>{e.preventDefault();if(!tipConfirm){tipConfirm=true;e.target.textContent='Tap again to confirm';e.target.style.color='var(--r)';return}TS.hidden=[...(TS.hidden||[]),t[0]];post({hide:t[0]});showTip()};
 $('#tOff').onclick=e=>{e.preventDefault();TS.active=false;post({off:true});b.remove()};}

addEventListener('pagehide',()=>{stopCam();clearShot()});
