<script>
const API=/github\.io$/.test(location.hostname)?'https://k12-southeast-dashboard.tss-receivables.workers.dev':'';
const did=()=>{try{let d=localStorage.getItem('k12did');if(!d){d=crypto.randomUUID();localStorage.setItem('k12did',d)}return d}catch(e){return 'shared'}};const tokGet=()=>{try{return localStorage.getItem('k12tok')||''}catch(e){return ''}},tokSet=t=>{try{t?localStorage.setItem('k12tok',t):localStorage.removeItem('k12tok')}catch(e){}};
const _f=window.fetch.bind(window);window.fetch=(u,o={})=>{if(typeof u==='string'&&/^\/(api|oauth)\//.test(u)){const h=new Headers(o.headers||{});const t=tokGet();if(t)h.set('x-k12-session',t);h.set('x-k12-user',did());return _f(API+u,{...o,headers:h,credentials:'include'})}return _f(u,o)};
function oauthURL(){return API+'/oauth/google/start?s='+encodeURIComponent(tokGet())+'&u='+encodeURIComponent(did())+'&r='+encodeURIComponent(location.origin+location.pathname)}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-oauth]');if(a){e.preventDefault();location.href=oauthURL()}});
let MODE='auto';if(MODE==='auto')MODE=new URLSearchParams(location.search).get('token')?'setup':(tokGet()?'app':'login');
async function signOut(){try{await fetch('/api/signout',{method:'POST'})}catch(e){}try{Object.keys(localStorage).filter(k=>/^k12(tip|note|welcome|seen)/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}tokSet('');if(API)location.reload();else location.href='/logout'}
function driveBlock(full){if(RS&&RS.drive)return `<div class="g" style="margin:8px 0">✓ Google Drive connected <button class="btn" onclick="api('/api/receipts/disconnect',{method:'POST'}).then(()=>{RS.drive=false;app()})">Disconnect Drive</button></div>`;
 return `<button class="mail" data-gd style="border:0;cursor:pointer;${full?'display:block;width:100%;':''}margin:8px 0;padding:12px;font-size:15px">☁️ Connect Google Drive</button>${RS&&!RS.google?'<div class="mut">Google Drive sign-in is not set up yet (needs Austin\'s Google OAuth client).</div>':''}`}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-gd]');if(!a)return;e.preventDefault();if(RS&&!RS.google){alert('Google Drive sign-in is not set up yet.');return}location.href=oauthURL()});
function curTheme(){return document.documentElement.dataset.theme==='dark'?'dark':'light'}
function applyTheme(t,save){{const m=document.getElementById('csMeta');if(m)m.content=t==='dark'?'dark':'light'}if(t==='dark')document.documentElement.dataset.theme='dark';else delete document.documentElement.dataset.theme;try{localStorage.setItem('k12theme',t)}catch(e){}const b=document.getElementById('thBtn');if(b)b.textContent=t==='dark'?'🌙 Dark':'☀️ Light';b.title='Theme: '+(t==='dark'?'Dark':'Light')+' (tap to switch)';
 if(save&&MODE==='app')fetch('/api/prefs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({theme:t})}).catch(()=>{})}
document.getElementById('thBtn').onclick=()=>applyTheme(curTheme()==='dark'?'light':'dark',true);applyTheme(curTheme(),false);
if(MODE==='app')fetch('/api/prefs',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.theme&&j.theme!==curTheme())applyTheme(j.theme,false)}).catch(()=>{});const $=s=>document.querySelector(s);
const $$=n=>'$'+Math.round(n||0).toLocaleString();const pct=(a,b)=>b?Math.round(a/b*100):null;
const cls=p=>p==null?'':p>=100?'g':p>=80?'y':'r';
function pinUI(title,sub,onDone){let v='';const max=5;let busy=false;
 $('#root').innerHTML=`<div class="pin"><h2 style="color:var(--navy)">${title}</h2><div class="mut">${sub}</div><div class="dots" id="d"></div><div class="err" id="e"></div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button class="x" data-c>Clear</button><button data-n="0">0</button><button class="x" data-b>⌫</button></div>${MODE!=='setup'?'<button class="btn" style="margin-top:16px;width:100%" id="go">Sign in</button>':'<button class="btn" style="margin-top:16px;width:100%" id="go">Save PIN</button>'}</div>`;
 const draw=()=>{$('#d').innerHTML=Array.from({length:5},(_, i)=>`<i class="${i<v.length?'f':''}"></i>`).join('')};draw();
 document.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{if(b.dataset.n!=null&&v.length<max){v+=b.dataset.n;if(v.length===max&&!busy){$('#e').textContent='';draw();setTimeout(()=>$('#go').click(),120);return}}else if('c'in b.dataset)v='';else if('b'in b.dataset)v=v.slice(0,-1);$('#e').textContent='';draw()});
 $('#go').onclick=async()=>{if(busy)return;if(v.length!==max){$('#e').textContent='Enter all 5 digits';return}busy=true;const m=await onDone(v);busy=false;if(m){$('#e').textContent=m;v='';draw()}};}
async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(r.ok&&j.token)tokSet(j.token);return r.ok?null:(j.error||'Error');}
if(MODE==='login')pinUI('Welcome, Nathan','Enter your 5-digit PIN',async v=>{const e=await post('/api/login',{pin:v});if(!e)location.reload();return e});
else if(MODE==='setup')pinUI('Create your PIN','Choose a 5-digit PIN',async v=>{const e=await post('/api/setup',{pin:v,token:new URLSearchParams(location.search).get('token')});if(!e)location.href=location.pathname;return e});
else app();
const ALLST=['FL','GA','AL','MS','SC','NC'];const STATES=()=>['FL','GA','AL','MS','SC'].concat(S&&((false)||(S.reps||[]).some(r=>(r.regions||[]).some(g=>g.state==='NC')))?['NC']:[]);
let S,lb='ytd',terr='All',tab='dash';
const ETf=o=>new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',...o});
function greet(){const h=+ETf({hour:'numeric',hourCycle:'h23'}).format(new Date());return h>=5&&h<12?'Good morning Nathan':h>=12&&h<17?'Good afternoon Nathan':'Good night Nathan'}
function clk(){return ETf({weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'}).format(new Date())+' CT'}
const WX={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Heavy showers',95:'Thunderstorms',96:'Thunderstorms',99:'Thunderstorms'};
let W=null;function wxTxt(){return W?`Prattville, AL · ${Math.round(W.temp)}°F · ${WX[W.code]||'—'} · H ${Math.round(W.hi)}° / L ${Math.round(W.lo)}°`:'Prattville, AL · loading weather…'}
async function loadWx(){try{const r=await fetch('/api/weather');if(r.ok){W=await r.json();const e=$('#wx');if(e)e.textContent=wxTxt()}}catch{}}
setInterval(()=>{const c=$('#clk'),g=$('#greet');if(c)c.textContent=clk();if(g)g.textContent=greet()},1000);
setInterval(loadWx,15*60e3);
async function settings(){let R=await api('/api/roster');let conf=null;try{RS=await api('/api/receipts/status')}catch{}
 const draw=()=>{$('#sh').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;color:var(--navy)">⚙️ Settings · Roster</h2><button class="btn" id="sClose">Close</button></div>
 ${driveBlock(true)}
 <div class="mut" style="margin:6px 0">Only active reps appear on the dashboard and receive data from the daily digest. Removing a rep hides them but keeps their history.</div>
 ${R.map((r,i)=>`<div class="row" style="cursor:default;flex-wrap:wrap;${r.hidden?'opacity:.55':''}"><span class="nm"><b>${esc(r.name)}</b>${r.hidden?' <span class="mut">(removed)</span>':''}<div class="mut">${esc(r.email||'')}</div></span>
  <input data-tt="${i}" value="${esc(r.territory)}" style="width:150px;border:1px solid #ccd;border-radius:6px;padding:4px" ${r.hidden?'disabled':''}>
  <span class="tg">${ALLST.map(s=>`<button type="button" data-tc="${i}" data-sv2="${s}" class="${(r.regions||[]).some(g=>g.state===s)?'on':''}" ${r.hidden?'disabled':''} style="padding:3px 8px;font-size:12px">${s}</button>`).join('')}</span>
  ${r.hidden?`<button class="btn" data-rs="${i}">Restore</button>`:`<button class="btn" data-sv="${i}">Save</button> <button class="btn" data-rm="${i}" style="${conf===i?'color:#fff;background:var(--r);border-color:var(--r)':''}">${conf===i?'Tap again to remove':'Remove'}</button>`}</div>`).join('')}

 <h3>Add a rep</h3><div class="grid"><input id="aName" placeholder="Full name"><input id="aEmail" placeholder="Email (default FLast@howard.com)"><input id="aTerr" placeholder="Territory, e.g. North Florida"><select id="aState"><option value="">State</option>${ALLST.map(s=>`<option>${s}</option>`).join('')}</select></div>
 <button class="mail" id="aAdd" style="border:0;margin-top:8px;cursor:pointer">Add rep</button><div class="err" id="sErr"></div>`;
 if($('#ncTog'))$('#ncTog').onchange=async e=>{try{const r=await api('/api/roster',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'config',nc:e.target.checked})});S.config=r.config;if(!S.config.nc&&terr==='NC')terr='All';draw()}catch(x){$('#sErr').textContent=x.message}};
 document.querySelectorAll('[data-tc]').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
 $('#sClose').onclick=()=>{$('#m').classList.remove('on');app()};
 $('#aName').oninput=e=>{const p=e.target.value.replace(/\./g,'').trim().split(/\s+/);$('#aEmail').placeholder=p.length>1?(p[0][0].toUpperCase()+p[p.length-1][0].toUpperCase()+p[p.length-1].slice(1).toLowerCase()+'@howard.com'):'Email (default FLast@howard.com)'};
 const go=async b=>{try{R=await api('/api/roster',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});conf=null;draw()}catch(e){$('#sErr').textContent=e.message}};
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rm;if(conf!==i){conf=i;draw();return}go({action:'remove',name:R[i].name})});
 document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>go({action:'restore',name:R[+b.dataset.rs].name}));
 document.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sv;go({action:'edit',name:R[i].name,territory:document.querySelector(`[data-tt="${i}"]`).value,states:[...document.querySelectorAll(`[data-tc="${i}"].on`)].map(x=>x.dataset.sv2)})});
 $('#aAdd').onclick=()=>go({action:'add',name:$('#aName').value,email:$('#aEmail').value,territory:$('#aTerr').value||'Unknown',state:$('#aState').value})};
 draw();$('#m').classList.add('on');}
async function hdrDrive(){try{RS=await api('/api/receipts/status');const h=$('#gdHdr');if(h)h.hidden=!!RS.drive}catch{}}
async function app(){hdrDrive();const gb=$('#gearBtn');if(gb){gb.hidden=false;gb.onclick=settings}loadWx();if(location.hash==='#receipts'){tab='rcp';history.replaceState(null,'','/')}setTimeout(initTips,800);$('#lo').hidden=false;const r=await fetch('/api/data');if(r.status===401){tokSet('');return API?location.reload():(location.href='/logout')}S=await r.json();render();}
function qd(){const ds=Object.keys(S.quotes||{}).sort();const today=new Date().toLocaleDateString('en-CA',{timeZone:'America/Chicago'});const prev=ds.filter(d=>d<today);return{ds,today,yest:prev[prev.length-1]}}
function repQ(n){const {ds,today,yest}=qd();const g=d=>(S.quotes[d]||{})[n];const all=ds.map(g).filter(Boolean);const last=[...all].reverse().find(x=>x.avg_per_day!=null);return{t:g(today),y:yest&&g(yest),avg:last?+last.avg_per_day:all.length?all.reduce((a,b)=>a+b.count,0)/all.length:null,rpt:!!last,days:all.length}}
function reps(){return S.reps.filter(r=>terr==='All'||(r.regions||[]).some(g=>g.state===terr))}
function terrLabel(r){if(terr!=='All'){const g=(r.regions||[]).find(g=>g.state===terr);if(g)return g.label}return r.territory||'Unknown'}
function render(){const R=reps();const tk=R.map((r,i)=>{const mp=pct(r.mtd_ordered,r.mtd_budget),yp=pct(r.ytd_ordered,r.ytd_budget);return `<div class="t"><b>${r.name}</b><div class="l">📍 ${esc(terrLabel(r))}</div>${repBands(r,false)}<div class="m"><span class="l">MTD</span> <span class="v">${$$(r.mtd_ordered)} / ${$$(r.mtd_budget)} <b class="${cls(mp)}" style="display:inline">${mp==null?'n/a':mp+'%'}</b></span><div class="l">CTO ${r.mtd_cto_pct}% · Hit ${r.mtd_hit_rate}% · Inv ${$$(r.mtd_invoiced)}${hl(r.name).length?` · <span class="r">${hl(r.name).length} hold</span>`:''}</div></div><div class="y" hidden><span class="l">YTD</span> <span class="v">${$$(r.ytd_ordered)} / ${$$(r.ytd_budget)} <b class="${cls(yp)}" style="display:inline">${yp==null?'n/a':yp+'%'}</b></span><div class="l">CTO ${r.ytd_cto_pct}% · Hit ${r.ytd_hit_rate}% · ${r.total_customers} cust</div></div></div>`}).join('');
 const k=lb==='ytd'?'ytd_ordered':'mtd_ordered',bk=lb==='ytd'?'ytd_budget':'mtd_budget';const L=[...R].sort((a,b)=>b[k]-a[k]);const mx=L[0]?L[0][k]:1;
